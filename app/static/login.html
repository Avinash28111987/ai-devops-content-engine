<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#102b46">
  <title>Sign in · AI DevOps Content Engine</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182230;background:#f2f6fa;font-synthesis:none}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#e2edf7 0,transparent 52%),#f2f6fa}
    .card{width:min(100%,420px);padding:34px;background:#fff;border:1px solid #dce5ee;border-radius:18px;box-shadow:0 18px 50px #17324b12}
    .mark{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:#e8f2fb;color:#1769aa;font-size:22px;font-weight:800}
    h1{margin:22px 0 8px;font-size:24px;letter-spacing:-.025em;color:#102b46}.intro{margin:0 0 26px;color:#627386;font-size:14px;line-height:1.55}
    label{display:block;margin:16px 0 7px;font-size:13px;font-weight:650;color:#344b61}
    input{width:100%;padding:12px 13px;border:1px solid #cbd6e1;border-radius:8px;background:#fff;font:inherit;font-size:15px;color:#182230;outline:none}
    input:focus{border-color:#3487c4;box-shadow:0 0 0 3px #3487c420}
    button{width:100%;margin-top:22px;padding:12px 16px;border:0;border-radius:8px;background:#1769aa;color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
    button:hover{filter:brightness(.96)}button:disabled{opacity:.65;cursor:wait}
    .error{min-height:20px;margin:12px 0 0;color:#a52e2e;font-size:13px;line-height:1.45}.error:empty{display:none}
    .foot{margin:24px 0 0;text-align:center;color:#8593a2;font-size:12px}
    @media(max-width:480px){.card{padding:26px 22px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">✦</div>
    <h1>Welcome back</h1>
    <p class="intro">Sign in to open your AI DevOps content queue.</p>
    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="submit" type="submit">Sign in</button>
      <p id="error" class="error" role="alert" aria-live="polite"></p>
    </form>
    <p class="foot">AI DevOps Content Engine</p>
  </main>
  <script>
    const form=document.querySelector('#login-form'),button=document.querySelector('#submit'),error=document.querySelector('#error');
    form.addEventListener('submit',async event=>{
      event.preventDefault();error.textContent='';button.disabled=true;button.textContent='Signing in…';
      try{
        const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:form.username.value,password:form.password.value})});
        const result=await response.json();
        if(!response.ok)throw new Error(result.detail||'Sign in failed. Please try again.');
        location.replace('/');
      }catch(err){error.textContent=err.message||'Could not sign in. Check your connection and try again.';button.disabled=false;button.textContent='Sign in';}
    });
  </script>
</body>
</html>
